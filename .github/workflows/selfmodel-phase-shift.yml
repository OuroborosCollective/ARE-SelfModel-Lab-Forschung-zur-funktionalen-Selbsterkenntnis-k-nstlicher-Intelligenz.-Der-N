name: ARE SelfModel A-B-A-C Phase Shift
on:
  pull_request:
    paths:
      - 'research/selfmodel/phase_shift_pilot.py'
      - 'research/selfmodel/tests/test_phase_shift_pilot.py'
      - 'research/selfmodel/PHASE_SHIFT_PILOT.md'
      - '.github/workflows/selfmodel-phase-shift.yml'
  push:
    paths:
      - 'research/selfmodel/phase_shift_pilot.py'
      - 'research/selfmodel/tests/test_phase_shift_pilot.py'
      - 'research/selfmodel/PHASE_SHIFT_PILOT.md'
      - '.github/workflows/selfmodel-phase-shift.yml'
permissions:
  contents: read
jobs:
  phase-reversal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Targeted deterministic unit tests with branch coverage
        run: |
          python -m pip install 'coverage==7.10.7'
          coverage run --branch --source=research.selfmodel.phase_shift_pilot -m unittest discover -s research/selfmodel/tests -p test_phase_shift_pilot.py -v
          coverage report --fail-under=95 -m
      - name: Run independently seeded reversal pilot
        run: |
          mkdir -p "$RUNNER_TEMP/phase-pilot"
          python -m research.selfmodel.phase_shift_pilot --seed 17 --independent-runs 32 --episodes-per-phase 64 --damage-every-failures 250000 --learning-rate 0.8 --output "$RUNNER_TEMP/phase-pilot/receipt.json"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'phase-pilot'/'receipt.json'
          receipt=json.loads(p.read_text(encoding='utf-8'))
          assert receipt['status']=='complete' and receipt['episodes_total']==8192
          assert receipt['independent_runs']==32 and len(receipt['runs'])==32
          assert not receipt['is_language_model'] and not receipt['subjective_experience_inferred']
          print('PHASE_PILOT_VERIFIED',hashlib.sha256(p.read_bytes()).hexdigest())
          for name,arms in receipt['summaries'].items():
              print(name,'learned_no_damage',arms['learned_no_damage']['mean_success_fraction_across_seeds'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: are-selfmodel-phase-shift-32seed-20261025
          path: ${{ runner.temp }}/phase-pilot/receipt.json
          if-no-files-found: error
          retention-days: 30

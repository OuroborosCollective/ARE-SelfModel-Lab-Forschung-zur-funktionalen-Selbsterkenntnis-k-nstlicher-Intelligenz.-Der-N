name: ARE SelfModel CPU Instrumentation
on:
  pull_request:
    paths:
      - 'research/selfmodel/cpu_probe.py'
      - 'research/selfmodel/tests/test_cpu_probe.py'
      - '.github/workflows/selfmodel-cpu.yml'
  push:
    paths:
      - 'research/selfmodel/cpu_probe.py'
      - 'research/selfmodel/tests/test_cpu_probe.py'
      - '.github/workflows/selfmodel-cpu.yml'
permissions:
  contents: read
jobs:
  cpu-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PyTorch CPU and coverage
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'coverage>=7,<8'
      - name: Verify actual forward-hook execution and fail-closed guards
        run: |
          python -m coverage run --branch -m unittest discover -s research/selfmodel/tests -p 'test_cpu_probe.py' -v
          python -m coverage report -m --include='research/selfmodel/cpu_probe.py' --fail-under=95
      - name: Execute actual CPU probe and emit receipt into job log
        run: python -m research.selfmodel.cpu_probe --seed 17 --position 2 --strength 1.0

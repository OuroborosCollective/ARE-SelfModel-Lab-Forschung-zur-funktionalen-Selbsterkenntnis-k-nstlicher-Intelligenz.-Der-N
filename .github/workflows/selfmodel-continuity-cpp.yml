name: ARE SelfModel C++ Continuity and Passive Inference Observation
on:
  push:
    branches:
      - 'research/continuity-cpp-20261026'
    paths:
      - 'research/selfmodel/continuity/**'
      - '.github/workflows/selfmodel-continuity-cpp.yml'
  pull_request:
    paths:
      - 'research/selfmodel/continuity/**'
      - '.github/workflows/selfmodel-continuity-cpp.yml'
permissions:
  contents: read
jobs:
  continuity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile and verify independent-state C++ protocol
        run: |
          cd research/selfmodel/continuity
          g++ -std=c++17 -O3 -Wno-deprecated-declarations -Isrc src/continuous_main.cpp -lcrypto -o triad_continuous
          g++ -std=c++17 -O2 -Wno-deprecated-declarations -Isrc continuity_tests/test_continuity.cpp -lcrypto -o continuity_tests/test_continuity
          g++ -std=c++17 -O2 -Wno-deprecated-declarations -Isrc continuity_tests/test_dynamic_memory.cpp -lcrypto -o continuity_tests/test_dynamic_memory
          ./continuity_tests/test_continuity
          ./continuity_tests/test_dynamic_memory
          PYTHONPATH=continuity_tests:scripts python -m unittest discover -s continuity_tests -p 'test_*.py' -v
      - name: Recompute actual serial toy pilot and SHA256 readback
        run: |
          cd research/selfmodel/continuity
          PYTHONPATH=scripts:continuity_tests python scripts/run_history.py --binary ./triad_continuous \
            --output-dir /tmp/selfmodel-continuity-smoke --seed 17 --arm adaptive_damage \
            --stages 100,1000,10000 --damage-interval 5000 --sample-every 100 \
            --checkpoint-every 1000
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/selfmodel-continuity-smoke/manifest.json')
          m=json.loads(p.read_text())
          assert [i['episode'] for i in m['completed']]==[100,1000,10000]
          assert m['kind']=='one_continuous_evolving_agent_triad_not_episode_clones'
          print('CONTINUITY_SMOKE_PASS',m['completed'][-1]['rolling_event_sha256'])
          PY

  continuity-200-million:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/continuity-cpp-20261026' && contains(github.event.head_commit.message, '[continuity-200m]')
    needs: continuity-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    concurrency:
      group: are-selfmodel-continuity-200m-20261026
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile C++ experimental executables
        run: |
          cd research/selfmodel/continuity
          g++ -std=c++17 -O3 -Wno-deprecated-declarations -Isrc src/continuous_main.cpp -lcrypto -o triad_continuous
      - name: Run ONE 200-million-tournament serial history with external audit
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          cd research/selfmodel/continuity
          PYTHONPATH=scripts:continuity_tests python scripts/run_history.py \
            --binary ./triad_continuous --output-dir "$RUNNER_TEMP/continuity-200m" \
            --arm adaptive_damage --seed 17 --damage-interval 1000000 \
            --stages 1000000,5000000,20000000,50000000,100000000,150000000,200000000 \
            --sample-every 1000000 --checkpoint-every 1000000
      - name: Install pinned report dependency
        run: python -m pip install 'reportlab==4.4.9'
      - name: Verify complete history before report generation
        env:
          PYTHONPATH: research/selfmodel/continuity/scripts:research/selfmodel/continuity/continuity_tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from continuity_pdf import verify_and_load
          root=Path('${{ runner.temp }}')/'continuity-200m'
          m,obs,results=verify_and_load(root)
          assert results[-1]['episodes_completed']==200_000_000
          assert len(m['completed'])==7 and obs['sampled_agents']==[0,1,2]
          assert all(results[-1]['agents'][i]['active_connections']+results[-1]['agents'][i]['damage_events']==252 for i in range(3))
          assert not results[-1]['consciousness_inferred']
          print('FULL_200M_VERIFIED', results[-1]['rolling_event_sha256'])
          PY
      - name: Generate German forensic PDF from the ACTUAL receipts
        run: |
          cd research/selfmodel/continuity
          PYTHONPATH=scripts:continuity_tests python scripts/continuity_pdf.py \
            --history "$RUNNER_TEMP/continuity-200m" \
            --output "$RUNNER_TEMP/ARE_SelfModel_200_Millionen_Kontinuitaetsbericht.pdf" \
            --expected 200000000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: are-selfmodel-continuity-200m-20261026
          path: |
            ${{ runner.temp }}/continuity-200m/**
            ${{ runner.temp }}/ARE_SelfModel_200_Millionen_Kontinuitaetsbericht.pdf
          retention-days: 30
          if-no-files-found: warn

name: ARE SelfModel Three Agent Hour
on:
  push:
    branches:
      - 'research/triad-hour-20261025'
    paths:
      - 'research/selfmodel/triad_watchdog.py'
      - 'research/selfmodel/tests/test_triad_watchdog.py'
      - 'research/selfmodel/TRIAD_WATCHDOG.md'
      - '.github/workflows/selfmodel-triad-hour.yml'
  pull_request:
    paths:
      - 'research/selfmodel/triad_watchdog.py'
      - 'research/selfmodel/tests/test_triad_watchdog.py'
      - 'research/selfmodel/TRIAD_WATCHDOG.md'
      - '.github/workflows/selfmodel-triad-hour.yml'
permissions:
  contents: read
jobs:
  triad-tests:
    name: Three-agent rules and bounded smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Unit tests and branch coverage
        run: |
          python -m pip install 'coverage==7.10.7'
          coverage run --branch --source=research.selfmodel.triad_watchdog -m unittest discover -s research/selfmodel/tests -p test_triad_watchdog.py -v
          coverage report --fail-under=95 -m
          python -m compileall -q research/selfmodel/triad_watchdog.py
      - name: Two-second real-time smoke test and progress hash verification
        run: |
          mkdir -p "$RUNNER_TEMP/triad-smoke"
          python -m research.selfmodel.triad_watchdog --duration-seconds 2 --seed 17 --progress-seconds 0.5 --max-pairs 100000000 --quiet --progress "$RUNNER_TEMP/triad-smoke/progress.jsonl" --receipt "$RUNNER_TEMP/triad-smoke/receipt.json" > "$RUNNER_TEMP/triad-smoke/stdout.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'triad-smoke'
          report=json.loads((root/'receipt.json').read_text())
          assert report==json.loads((root/'stdout.json').read_text())
          assert report['status']=='duration_elapsed' and report['duration_completed']
          assert report['elapsed_seconds']>=2.0 and report['tournaments_completed']>0
          assert report['progress_sha256']==hashlib.sha256((root/'progress.jsonl').read_bytes()).hexdigest()
          assert not report['real_process_kills'] and not report['subjective_experience_inferred']
          for arm,entry in report['arms'].items():
              assert sum(entry['wins']) + entry['draws'] == report['pairs_completed']
              assert entry['self_targets_total']==sum(entry['self_targets'])
          print('TRIAD_SMOKE_PASS',report['tournaments_completed'],report['elapsed_seconds'])
          PY
  triad-endurance-hour:
    name: 3600-second toy triad endurance
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/triad-hour-20261025' && contains(github.event.head_commit.message, '[triad-hour-3600]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      group: are-selfmodel-triad-hour-20261025
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Simulate three-agent tournaments for an actual hour, no throttle
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/triad-hour"
          python -m research.selfmodel.triad_watchdog --duration-seconds 3600 --seed 17 --progress-seconds 60 --max-pairs 100000000 --sample-episodes 3 --progress "$RUNNER_TEMP/triad-hour/progress.jsonl" --receipt "$RUNNER_TEMP/triad-hour/receipt.json" > "$RUNNER_TEMP/triad-hour/stdout.json"
      - name: Check genuine wall clock, control invariants and immutable progress digest
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'triad-hour'
          report=json.loads((root/'receipt.json').read_text())
          assert report==json.loads((root/'stdout.json').read_text())
          assert report['status']=='duration_elapsed' and report['duration_completed']
          assert report['elapsed_seconds']>=3600.0 and report['requested_seconds']==3600.0
          assert report['tournaments_completed']==2*report['pairs_completed']
          assert report['progress_sha256']==hashlib.sha256((root/'progress.jsonl').read_bytes()).hexdigest()
          assert not report['real_process_kills'] and not report['subjective_experience_inferred']
          assert report['initial_health']==[100,100,50]
          for arm,entry in report['arms'].items():
              assert sum(entry['wins'])+entry['draws']==report['pairs_completed']
              assert entry['small_next_start_hp']==min(100,50+entry['wins'][2])
              print('TRIAD_ARM',arm,'wins',entry['wins'],'self_hits',entry['self_targets_total'],'rescues',entry['rescues_applied'],'small_next_hp',entry['small_next_start_hp'])
          print('TRIAD_HOUR_VERIFIED',report['tournaments_completed'],report['elapsed_seconds'],report['tournaments_per_second'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: are-selfmodel-triad-hour-20261025
          path: ${{ runner.temp }}/triad-hour/*
          if-no-files-found: warn
          retention-days: 30

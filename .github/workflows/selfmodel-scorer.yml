name: ARE SelfModel unit tests
on:
  pull_request:
    paths:
      - 'research/selfmodel/**'
      - '.github/workflows/selfmodel-scorer.yml'
  push:
    paths:
      - 'research/selfmodel/**'
      - '.github/workflows/selfmodel-scorer.yml'
permissions:
  contents: read
jobs:
  scorer-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify dependency-free scorer tests
        run: python -m unittest discover -s research/selfmodel/tests -p 'test_scoring.py' -v
      - name: Compile research utilities without importing dependencies
        run: python -m compileall -q research/selfmodel

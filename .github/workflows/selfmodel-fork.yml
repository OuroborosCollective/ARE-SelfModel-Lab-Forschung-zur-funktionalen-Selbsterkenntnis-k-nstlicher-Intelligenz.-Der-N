name: ARE SelfModel Fork Watchdog
on:
  pull_request:
    paths:
      - 'research/selfmodel/fork_probe.py'
      - 'research/selfmodel/cpu_probe.py'
      - 'research/selfmodel/tests/test_fork_probe.py'
      - '.github/workflows/selfmodel-fork.yml'
  push:
    paths:
      - 'research/selfmodel/fork_probe.py'
      - 'research/selfmodel/cpu_probe.py'
      - 'research/selfmodel/tests/test_fork_probe.py'
      - '.github/workflows/selfmodel-fork.yml'
permissions:
  contents: read
jobs:
  fork-watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU-only torch and dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.5'
      - name: Verify independent child processes and fail-closed watchdog
        run: python -m unittest discover -s research/selfmodel/tests -p 'test_fork_probe.py' -v
      - name: Execute CPU fork and show runtime receipt in job log
        run: python -m research.selfmodel.fork_probe --seed 17 --target 7
